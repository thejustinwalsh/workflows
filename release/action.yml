name: "Changeset Release"
description: "Version, publish, and tag via changesets. Outputs what was published and whether anything was released."

inputs:
  version-command:
    description: "Command to bump versions (e.g. 'pnpm changeset:version' or 'bun run changeset:version')"
    required: false
    default: "npx changeset version"
  title:
    description: "Title for the release PR"
    required: false
    default: "chore: release"
  commit:
    description: "Commit message for the release PR"
    required: false
    default: "chore: release"
  create-github-releases:
    description: "Whether changesets creates per-package GitHub Releases (default: true). Set to false when using fixed-github-release."
    required: false
    default: "true"

outputs:
  released:
    description: "true if anything was published — gate downstream jobs on this"
    value: ${{ steps.summary.outputs.released }}
  published-packages:
    description: "JSON array of published packages [{name, version}] (includes private packages that were git-tagged)"
    value: ${{ steps.changesets.outputs.publishedPackages }}

runs:
  using: "composite"
  steps:
    - name: Create Release Pull Request or Publish
      id: changesets
      uses: changesets/action@v1
      with:
        publish: npx changeset publish
        version: ${{ inputs.version-command }}
        title: ${{ inputs.title }}
        commit: ${{ inputs.commit }}
        createGithubReleases: ${{ inputs.create-github-releases }}
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Summarize
      id: summary
      shell: bash
      run: |
        published='${{ steps.changesets.outputs.publishedPackages }}'
        has_published=$(node -e "console.log(JSON.parse(process.argv[1] || '[]').length > 0)" "$published")

        if [ "$has_published" = "true" ]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Released: $published"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "Nothing released"
        fi
