name: "Changeset Release"
description: "Create a release PR via changesets, or tag and publish when the release PR is merged"

inputs:
  version-command:
    description: "Command to bump versions (e.g. 'pnpm changeset:version' or 'bun run changeset:version')"
    required: false
    default: "npx changeset version"
  publish-command:
    description: "Command to run after versioning (e.g. 'pnpm release' or 'bun run build'). Set to empty string to skip."
    required: false
    default: ""
  title:
    description: "Title for the release PR"
    required: false
    default: "chore: release"
  commit:
    description: "Commit message for the release PR"
    required: false
    default: "chore: release"
  version-package:
    description: "Path to a package.json to read the version from for git tagging (e.g. ./packages/shared/package.json)"
    required: false
    default: "./package.json"
  create-github-release:
    description: "Create a GitHub Release with auto-generated notes when a version is published"
    required: false
    default: "true"

outputs:
  published:
    description: "Whether a new version was published"
    value: ${{ steps.changesets.outputs.published }}
  published-packages:
    description: "JSON array of published packages"
    value: ${{ steps.changesets.outputs.publishedPackages }}
  version:
    description: "The version that was published (if any)"
    value: ${{ steps.version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Create Release Pull Request or Publish
      id: changesets
      uses: changesets/action@v1
      with:
        publish: ${{ inputs.publish-command }}
        version: ${{ inputs.version-command }}
        title: ${{ inputs.title }}
        commit: ${{ inputs.commit }}
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Get version
      if: steps.changesets.outputs.published == 'true'
      id: version
      shell: bash
      run: |
        version=$(node -e "console.log(require('${{ inputs.version-package }}').version)")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Published version: $version"

    # Only create git tag if changesets didn't already (i.e. no npm publish happened).
    # When publish-command runs `changeset publish`, changesets creates per-package
    # tags (@scope/pkg@version) and GitHub Releases automatically.
    # We only need to fill in when that path is skipped (private packages).
    - name: Check if tag exists
      if: steps.changesets.outputs.published == 'true'
      id: tag-check
      shell: bash
      run: |
        tag="v${{ steps.version.outputs.version }}"
        if git rev-parse "$tag" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create git tag
      if: steps.changesets.outputs.published == 'true' && steps.tag-check.outputs.exists == 'false'
      shell: bash
      run: |
        tag="v${{ steps.version.outputs.version }}"
        git tag "$tag"
        git push origin "$tag"

    - name: Check if GitHub Release exists
      if: steps.changesets.outputs.published == 'true' && inputs.create-github-release == 'true'
      id: release-check
      shell: bash
      env:
        GH_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release
      if: steps.changesets.outputs.published == 'true' && inputs.create-github-release == 'true' && steps.release-check.outputs.exists == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.version.outputs.version }}" \
          --repo "${{ github.repository }}" \
          --generate-notes
