name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: npm install

      - id: release
        uses: ./release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update floating major version tag (v1, v2, etc.)
      # This is the convention for GitHub Actions — users pin to @v1
      - name: Update major version tag
        if: steps.release.outputs.released == 'true'
        run: |
          # Read version from a workspace package that changesets bumps
          version=$(node -e "console.log(require('./release/package.json').version)")
          major="v$(echo "$version" | cut -d. -f1)"
          git tag -f "$major"
          git push origin "$major" --force
          echo "Updated floating tag: $major -> v$version"
